<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background circle -->
  <circle cx="90" cy="90" r="85" fill="#3B82F6" opacity="0.1" stroke="#3B82F6" stroke-width="2"/>
  
  <!-- Plane silhouette -->
  <g transform="translate(90, 90)">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="12" ry="28" fill="#3B82F6"/>
    
    <!-- Wings -->
    <rect x="-35" y="-8" width="70" height="16" rx="8" fill="#3B82F6"/>
    
    <!-- Tail wings -->
    <polygon points="0,-25 -12,-32 -8,-25 8,-25 12,-32" fill="#3B82F6"/>
    
    <!-- Cockpit -->
    <circle cx="0" cy="-15" r="5" fill="#1E40AF"/>
    
    <!-- Windows -->
    <circle cx="-3" cy="-8" r="2" fill="#1E40AF"/>
    <circle cx="3" cy="-8" r="2" fill="#1E40AF"/>
  </g>
</svg>